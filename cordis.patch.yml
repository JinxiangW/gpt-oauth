# dsh-llm-openai bundle: the subscription adapter. dsh-base already owns the
# authorization seam; inserting it again duplicates the Loader entry.
# The default llm-pi-ai row remains available for other provider profiles; do not
# configure its openai-codex route at the same time as this dedicated adapter.
- insert:
    - id: llm-openai
      name: dsh-llm-openai
