# dsh-llm-openai bundle: the subscription adapter and the DSH authorization seam.
# The default llm-pi-ai row remains available for other provider profiles; do not
# configure its openai-codex route at the same time as this dedicated adapter.
- insert:
    - id: authorization
      name: '@deepseek-ai/dsh-authorization'
    - id: llm-openai
      name: dsh-llm-openai
